<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question</title>
    <style>
        .subtle-section {
            padding: 5px 0;
        }

        input[type="submit"] {
            background: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
            border: 1px solid var(--vscode-button-border, transparent);
            padding: 4px 12px;
            font-family: var(--vscode-font-family);
            cursor: pointer;
        }

        select,
        input[type="text"] {
            background: var(--vscode-dropdown-background);
            color: var(--vscode-dropdown-foreground);
            border: 1px solid var(--vscode-dropdown-border);
            padding: 3px 6px;
            font-family: var(--vscode-font-family);
        }

        button {
            background: var(--vscode-button-background);
        }

        textarea {
            background-color: var(--vscode-editor-background);
            color: var(--vscode-editor-foreground);
            width: 100%;
            font-family: sans-serif;
            height: 150px;
            resize: vertical;
        }
    </style>
</head>

<body>
    <p>AI Host: {{aiHost}}</p>
    <select id="model_select"></select>

    <div class="subtle-section">
        <h2>Ask</h2>
        <form id="ask_form">
            <textarea name="question_textarea"></textarea>
            <input type="submit" value="ask" />
        </form>
    </div>

    <div class="subtle-section">
        <label for="answer">Answer</label>
        <textarea id="answer" readonly></textarea>
    </div>

    <div class="subtle-section">
        <form id="clear-form">
            <input type="submit" value="Clear" />
        </form>
    </div>

    <script>
        const vscode = acquireVsCodeApi();

        window.addEventListener('message', ({ data }) => {
            if (data.command === 'tagsResult') {
                const select = document.getElementById('model_select');
                data.result.models.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = opt.textContent = m.name;
                    select.appendChild(opt);
                });
            }
        });
        vscode.postMessage({ command: 'getTags' });

        const answer = document.getElementById('answer');

        window.addEventListener('message', ({ data }) => {
            if (data.command === 'tagsResult') {
                const select = document.getElementById('model_select');
                data.result.models.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = opt.textContent = m.name;
                    select.appendChild(opt);
                });
            }
            if (data.command === 'streamChunk') { answer.value += data.text; }
            if (data.command === 'streamDone') { answer.value += data.error ?? ''; }
        });

        document.getElementById('ask_form').addEventListener('submit', (e) => {
            e.preventDefault();
            answer.value = '';
            const question = e.target.question_textarea.value;
            const model = document.getElementById('model_select').value;
            vscode.postMessage({ command: 'submitForm', payload: { question, model } });
        });
    </script>

</body>

</html>
